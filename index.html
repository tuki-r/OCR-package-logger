<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Logger</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1>Package Logger</h1>
    </header>

    <div class="container">

        <!-- LOG FORM -->
        <div class="card">
            <h2>Log New Package</h2>
                <div class="form-group">
                    <label>Courier Sticker Photo</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment">
                    <small> Used for OCR extraction</small>
                    <!-- to read/extract text from the courier sticker image -->
                </div>

                <div class ="form-group">
                    <label>Package Photo</label>
                    <input type="file" id="packageImageInput" accept="image/*" capture="environment">
                    <small> Optional, visual reference</small>
                </div>

                <div class="form-group">
                    <label>Delivery Company</label>
                    <input type="text" id="deliveryCompany" placeholder="e.g. DHL, Aramex, PostNet">
                </div>
            
            <button class="btn-submit" id="submitBtn" onclick="submitPackage()">Log Package</button>
            <div id="result"></div>
        </div>

        <!-- PACKAGES TABLE -->
        <div class="table-card">
            <div class="table-header">
                <h2>Package Log</h2>
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">All</button>
                    <button class="tab-btn" id="tab-waiting" onclick="setFilter('waiting')">Waiting</button>
                    <button class="tab-btn" id="tab-collected" onclick="setFilter('collected')">Collected</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date Logged</th>
                            <th>Delivery Co.</th>
                            <th>Name</th>
                            <th>Unit</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Collected By</th>
                            <th>Relation</th> </th>
                            <th>Date Collected</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="packageTableBody">
                        <tr>
                            <td colspan="10">
                                <div class="empty-state"> 
                                    Loading packages...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

<div id="manageModal" class="modal-overlay">
    <div class="modal-box">

        <h3 class="modal-title">Manage Package</h3>

        <div class="modal-content">
            <button class="btn-view-image" onclick="viewImage('sticker')">View Sticker</button>
            <button class="btn-view-image" onclick="viewImage('package')">View Package Image</button>
            <div id="imageContainer" class="image-container">
                <p id="imageLabel"></p>
                <img id="stickerImage" src="" class="Image-preview">
            </div>
        </div>

        <hr class="modal-divider">

        <div class ="form-group">
            <label>Collected By</label>
            <input type="text" id="collectedByInput" placeholder="Enter name of collector">
        </div>

        <div class ="form-group">
            <label>Relationship to Resident</label>
            <select id="relationshipSelect">
                <option value="">Select relationship</option>
                <option value="Family">Family</option>
                <option value="Friend">Friend</option>
                <option value="Neighbor">Neighbour</option>
                <option value="Self">Self</option>
                <option value="Partner">Partner</option>
                <option value="Other">Other</option>
                <option value="Helper/Domestic Worker">Helper/Domestic Worker</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn-collect" id="collectBtn" onclick="confirmCollected()">Mark as Collected</button>
            <button class="btn-delete" id="deleteBtn" onclick="confirmPackage()">Delete Log</button>
            <button class="btn-close" id="closeModalBtn" onclick="closeModal()">Cancel</button>
        </div>

    </div>
</div>

    <script src="/static/js/app.js"></script>
</body>
</html>
