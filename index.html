<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Logger</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1>Package Logger</h1>
    </header>

    <div class="container">

        <!-- LOG FORM -->
        <div class="card">
            <h2>Log New Package</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Courier Sticker Photo</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment">
                </div>
                <div class="form-group">
                    <label>Delivery Company</label>
                    <input type="text" id="deliveryCompany" placeholder="e.g. DHL, Aramex, PostNet">
                </div>
            </div>
            <button class="btn-submit" id="submitBtn" onclick="submitPackage()">Log Package</button>
            <div id="result"></div>
        </div>

        <!-- PACKAGES TABLE -->
        <div class="table-card">
            <div class="table-header">
                <h2>Package Log</h2>
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">All</button>
                    <button class="tab-btn" id="tab-waiting" onclick="setFilter('waiting')">Waiting</button>
                    <button class="tab-btn" id="tab-collected" onclick="setFilter('collected')">Collected</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date Logged</th>
                            <th>Delivery Co.</th>
                            <th>Name</th>
                            <th>Unit</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Collected By</th>
                            <th>Relation</th> </th>
                            <th>Date Collected</th>
                        </tr>
                    </thead>
                    <tbody id="packageTableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="icon">📭</div>
                                    Loading packages...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
